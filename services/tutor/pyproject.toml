[project]
name = "sahai-tutor"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.0", "httpx>=0.27", "sahai-core"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]
# Only needed for SAHAI_TUTOR_BACKEND=hf. Kept optional so the stub image
# (the default, and what CI runs) stays fast to build.
hf = ["torch>=2.4", "transformers>=4.45", "peft>=0.13", "accelerate>=1.0", "safetensors>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
